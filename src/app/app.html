<div class="dashboard">
  <h1>Student Dashboard</h1>

  <div class="card">
    <h2>{{ name }}</h2>

    <p>
      Credits:
      <strong>{{ credits() }}</strong>
    </p>

    <p>
      Graduation Status:
      <strong>{{ graduationStatus }}</strong>
    </p>

    <button (click)="addCredits()">
      Add Credits
    </button>
  </div>
</div>
